name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    env:
      AUTH_SECRET: ci-auth-secret-change-me
      META_VERIFY_TOKEN: ci-meta-verify-token
      OPENAI_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schemas
        run: npm run prisma:validate
        env:
          DATABASE_URL: file:./dev.db

      - name: Validate Prisma production schema
        run: npx prisma validate --schema prisma/schema.postgres.prisma
        env:
          DATABASE_URL: postgresql://crm:password@localhost:5432/crm?schema=public

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:ci

      - name: Validate OpenCredit Foundation A unit tests
        run: npx --yes tsx@4.20.6 src/lib/opencredit-webhook.test.ts

      - name: Validate OpenCredit Foundation B onboarding tests
        run: npx --yes tsx@4.20.6 src/lib/opencredit-onboarding.test.ts

      - name: Validate chatbot definition and fail-closed scope
        run: npx --yes tsx@4.20.6 --test src/lib/chatbot-definition.test.ts src/lib/chatbot-foundation-scope.test.ts src/lib/chatbot-execution-engine.test.ts

      - name: Validate OpenCredit commercial identity schemas and safety guards
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-identity-storage.test.ts

      - name: Validate OpenCredit commercial access audit contract
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-access-audit.test.ts

      - name: Validate OpenCredit commercial access transactional service
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-access-service.test.ts

      - name: Validate OpenCredit remote identity audit contract
        run: npx --yes tsx@4.20.6 src/lib/opencredit-remote-identity-audit.test.ts

      - name: Validate OpenCredit remote identity transactional service
        run: npx --yes tsx@4.20.6 src/lib/opencredit-remote-identity-service.test.ts

      - name: Validate OpenCredit contact client profile adapter
        run: npx --yes tsx@4.20.6 src/lib/opencredit-contact-client-profile-adapter.test.ts

      - name: Validate OpenCredit commercial operation storage contract
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-operation-storage.test.ts

      - name: Validate OpenCredit commercial operation transactional service
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-operation-service.test.ts

      - name: Validate OpenCredit strict raw JSON parser
        run: npx --yes tsx@4.20.6 src/lib/opencredit-strict-json.test.ts

      - name: Validate OpenCredit trusted provider scope resolver
        run: npx --yes tsx@4.20.6 src/lib/opencredit-provider-scope-resolver.test.ts

      - name: Validate durable conversation inbound event contract
        run: npx --yes tsx@4.20.6 src/lib/conversation-inbound-event.test.ts

      - name: Validate passive Meta reply formats and scope
        run: npx --yes tsx@4.20.6 --test src/lib/meta-reply-correlation.test.ts src/lib/message-reply.test.ts src/lib/inbound-message.test.ts src/lib/meta-webhook-security.test.ts src/lib/webhook-channel-secrets.test.ts

      - name: Build
        run: npm run build

      - name: Validate shared authority on disposable SQLite
        shell: bash
        run: |
          export AUTHORITY_TEST_DATABASE_URL="file:${RUNNER_TEMP}/qevora-authority-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          export DATABASE_URL="$AUTHORITY_TEST_DATABASE_URL"
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          npx --yes tsx@4.20.6 --test src/lib/conversation-authority.test.ts
        env:
          TMPDIR: ${{ runner.temp }}

      - name: Validate durable inbound event on disposable SQLite
        shell: bash
        run: |
          export DATABASE_URL="file:${RUNNER_TEMP}/qevora-inbound-event-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.db"
          trap 'rm -f "${DATABASE_URL#file:}" "${DATABASE_URL#file:}-journal" "${DATABASE_URL#file:}-wal" "${DATABASE_URL#file:}-shm"' EXIT
          npx prisma db push --schema prisma/schema.prisma --skip-generate
          npx --yes tsx@4.20.6 src/lib/conversation-inbound-event.integration.ts
        env:
          INBOUND_EVENT_SQLITE_TEST: "1"
          TMPDIR: ${{ runner.temp }}

  postgres-migrations:
    name: PostgreSQL migrations and rate limiter
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: qevora_ci
          POSTGRES_PASSWORD: qevora_ci_password
          POSTGRES_DB: qevora_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qevora_ci -d qevora_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_ci?schema=public
      AUTH_SECRET: ci-auth-secret-change-me

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate PostgreSQL Prisma Client
        run: npm run prisma:generate:prod

      - name: Apply migration chain to disposable PostgreSQL
        run: npm run prisma:migrate:prod

      - name: Validate RateLimitBucket and PostgreSQL limiter
        run: npx --yes tsx@4.20.6 src/lib/rate-limit-postgres.integration.ts

      - name: Validate OpenCredit constraints and concurrent ingestion
        run: npx --yes tsx@4.20.6 src/lib/opencredit-postgres.integration.ts
        env:
          OPENCREDIT_POSTGRES_TEST: "1"

      - name: Validate durable inbound event PostgreSQL constraints and concurrency
        run: npx --yes tsx@4.20.6 src/lib/conversation-inbound-event.integration.ts
        env:
          INBOUND_EVENT_POSTGRES_TEST: "1"

      - name: Validate OpenCredit commercial identity persistence
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-identity-postgres.integration.ts
        env:
          OPENCREDIT_COMMERCIAL_IDENTITY_POSTGRES_TEST: "1"

      - name: Validate OpenCredit commercial access audit persistence
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-access-audit-postgres.integration.ts
        env:
          OPENCREDIT_COMMERCIAL_ACCESS_AUDIT_POSTGRES_TEST: "1"

      - name: Validate OpenCredit commercial access service transactions and concurrency
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-access-service-postgres.integration.ts
        env:
          OPENCREDIT_COMMERCIAL_ACCESS_SERVICE_POSTGRES_TEST: "1"

      - name: Validate OpenCredit remote identity audit persistence
        run: npx --yes tsx@4.20.6 src/lib/opencredit-remote-identity-audit-postgres.integration.ts
        env:
          OPENCREDIT_REMOTE_IDENTITY_AUDIT_POSTGRES_TEST: "1"

      - name: Validate OpenCredit remote identity service transactions and concurrency
        run: npx --yes tsx@4.20.6 src/lib/opencredit-remote-identity-service-postgres.integration.ts
        env:
          OPENCREDIT_REMOTE_IDENTITY_SERVICE_POSTGRES_TEST: "1"

      - name: Validate OpenCredit commercial operation persistence
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-operation-postgres.integration.ts
        env:
          OPENCREDIT_COMMERCIAL_OPERATION_POSTGRES_TEST: "1"

      - name: Validate OpenCredit commercial operation service transactions and concurrency
        run: npx --yes tsx@4.20.6 src/lib/opencredit-commercial-operation-service-postgres.integration.ts
        env:
          OPENCREDIT_COMMERCIAL_OPERATION_SERVICE_POSTGRES_TEST: "1"

      - name: Create dedicated disposable chatbot database
        run: echo 'CREATE DATABASE qevora_chatbot_test;' | npx prisma db execute --stdin --schema prisma/schema.postgres.prisma

      - name: Apply migrations to chatbot test database
        run: npm run prisma:migrate:prod
        env:
          DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_chatbot_test?schema=public

      - name: Validate chatbot persistence, constraints and concurrency
        run: npx --yes tsx@4.20.6 --test src/lib/chatbot-foundation.test.ts
        env:
          CHATBOT_FOUNDATION_TEST_DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_chatbot_test?schema=public
          CHATBOT_FOUNDATION_POSTGRES_TEST: "1"

      - name: Validate passive Meta correlation and concurrency
        run: npx --yes tsx@4.20.6 --test src/lib/meta-reply-correlation.integration.test.ts
        env:
          CHATBOT_REPLY_TEST_DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_chatbot_test?schema=public
          CHATBOT_REPLY_POSTGRES_TEST: "1"

      - name: Create dedicated disposable shared authority database
        run: echo 'CREATE DATABASE qevora_authority_test;' | npx prisma db execute --stdin --schema prisma/schema.postgres.prisma

      - name: Apply shared authority migration chain
        run: npm run prisma:migrate:prod
        env:
          DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_authority_test?schema=public

      - name: Validate shared authority constraints, audit and concurrency
        run: npx --yes tsx@4.20.6 --test src/lib/conversation-authority.test.ts
        env:
          AUTHORITY_POSTGRES_TEST: "1"
          AUTHORITY_TEST_DATABASE_URL: postgresql://qevora_ci:qevora_ci_password@127.0.0.1:5432/qevora_authority_test?schema=public
